<!DOCTYPE html>
<html lang="mul">
<head>
<meta charset="UTF-8">
<title>FluoroText – Fluorescent Text Highlighter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #fff0fb 0%, #fde5f5 100%);
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;
    color: #333;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(249,144,233,0.2);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #f990e9, #fbd7f5);
    color: #333;
    padding: 30px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 28px; font-weight: 600; color: #d946ef; }
  header p { margin: 10px 0 0; opacity: 0.9; font-size: 16px; }
  main { padding: 40px; }
  textarea {
    width: 100%;
    height: 180px;
    padding: 16px;
    border: 1px solid #fbd7f5;
    border-radius: 12px;
    font-size: 18px;
    resize: vertical;
    box-sizing: border-box;
    margin-bottom: 20px;
    transition: border 0.2s;
  }
  textarea:focus { outline: none; border-color: #f990e9; box-shadow: 0 0 0 3px rgba(249,144,233,0.3); }
  .presets {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 30px;
  }
  .preset-btn {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(249,144,233,0.25);
    transition: transform 0.2s;
  }
  .preset-btn:hover { transform: scale(1.1); }
  #output {
    font-size: 20px;
    line-height: 1.8;
    white-space: pre-wrap;
    min-height: 100px;
  }
  #output span {
    cursor: pointer;
    margin-right: 0.3em;
    transition: background-color 0.2s;
    display: inline-block;
    padding: 0.1em 0.4em;
    border-radius: 0.4em;
  }
  #colorPicker { display: none; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>FluoroText</h1>
    <p>Click on sentences → Fluorescent highlight | Quick presets below</p>
  </header>
  <main>
    <textarea id="input" placeholder="Enter your text here. End sentences with a period (.)\nExample: I love you. You love me too."></textarea>

    <div class="presets">
      <button class="preset-btn" style="background:#f990e9;" data-color="#f990e9" title="Magenta Pink"></button>
      <button class="preset-btn" style="background:#FFFF00;" data-color="#FFFF00" title="Classic Yellow"></button>
      <button class="preset-btn" style="background:#FF90C0;" data-color="#FF90C0" title="Pink"></button>
      <button class="preset-btn" style="background:#90FFB0;" data-color="#90FFB0" title="Mint"></button>
      <button class="preset-btn" style="background:#90C0FF;" data-color="#90C0FF" title="Blue"></button>
      <button class="preset-btn" style="background:#D090FF;" data-color="#D090FF" title="Purple"></button>
    </div>

    <div id="output"></div>
  </main>
</div>

<input type="color" id="colorPicker">

<script>
const colorPicker = document.getElementById('colorPicker');
let currentColor = '#f990e9'; // #f990e9 기본

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.onclick = () => {
    currentColor = btn.dataset.color;
    document.querySelectorAll('.preset-btn').forEach(b => b.style.boxShadow = '0 4px 8px rgba(249,144,233,0.25)');
    btn.style.boxShadow = '0 0 0 4px rgba(249,144,233,0.6)';
  };
});

function hexToRgb(hex) {
  hex = hex.replace('#', '');
  return {
    r: parseInt(hex.substr(0,2), 16),
    g: parseInt(hex.substr(2,2), 16),
    b: parseInt(hex.substr(4,2), 16)
  };
}

function openColorPicker(callback, defaultHex) {
  colorPicker.value = defaultHex;
  colorPicker.onchange = function(e) {
    callback(e.target.value);
    colorPicker.onchange = null;
  };
  colorPicker.click();
}

function applyHighlight(span, color) {
  const {r,g,b} = hexToRgb(color);
  span.style.backgroundColor = `rgba(${r},${g},${b},0.4)`;
}

function process() {
  const text = document.getElementById('input').value;
  const output = document.getElementById('output');
  output.innerHTML = '';

  if (!text.trim()) {
    output.textContent = 'Enter some text to get started.';
    return;
  }

  const parts = text.split('.');
  const sentences = parts
    .map(part => part.trim())
    .filter(part => part !== '')
    .map((part, index, array) => part + (index < array.length - 1 ? '.' : ''));

  sentences.forEach(sent => {
    const span = document.createElement('span');
    span.textContent = sent + ' ';

    span.onclick = function(e) {
      e.stopPropagation();

      const currentBg = getComputedStyle(this).backgroundColor;
      const isTransparent = currentBg === 'rgba(0, 0, 0, 0)' || currentBg === 'transparent';

      if (isTransparent) {
        applyHighlight(this, currentColor);
      } else {
        const match = currentBg.match(/\d+/g);
        if (match && match.length >= 3) {
          const [r,g,b] = match.slice(0,3).map(Number);
          const currentHex = '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('').toUpperCase();
          openColorPicker(color => {
            applyHighlight(this, color);
            currentColor = color;
          }, currentHex);
        }
      }
    };

    span.ondblclick = function(e) {
      e.preventDefault();
      this.style.backgroundColor = '';
    };

    output.appendChild(span);
  });
}

document.getElementById('input').addEventListener('input', process);
process();

// 초기 #f990e9 버튼 강조
document.querySelectorAll('.preset-btn')[0].style.boxShadow = '0 0 0 4px rgba(249,144,233,0.6)';
</script>

</body>
</html>
